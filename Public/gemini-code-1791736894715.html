<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Pramukh Wholesale Inc. — Commercial Packaging Supply (Toronto, ON)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navyDark: '#0f172a',
                        steelGray: '#334155',
                        safetyYellow: '#eab308',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-navyDark text-slate-100 antialiased min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_PRODUCTS = [
            { _id: '1', name: 'Molded Bagasse Meal Tray', category: 'plates', material: 'Bagasse', size: '5-Compartment (500 ct)', priceCAD: 145.00, sku: 'PRM-PLT-01', imageUrl: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=600&auto=format&fit=crop', stockQty: 250, inStock: true },
            { _id: '2', name: 'Heavy Duty Compostable Plate', category: 'plates', material: 'Bagasse', size: '9 Inch (500 ct)', priceCAD: 110.00, sku: 'PRM-PLT-02', imageUrl: 'https://images.unsplash.com/photo-1610557892470-55d9e80c0bce?w=600&auto=format&fit=crop', stockQty: 180, inStock: true },
            { _id: '3', name: 'Kraft Brown Paper Soup Bowl + Lid', category: 'bowls', material: 'Paper', size: '16 oz (500 ct)', priceCAD: 125.00, sku: 'PRM-BWL-01', imageUrl: 'https://images.unsplash.com/photo-1547592180-85f173990554?w=600&auto=format&fit=crop', stockQty: 320, inStock: true },
            { _id: '4', name: 'RPET Clear Hinged Takeout Container', category: 'containers', material: 'Plastic (RPET)', size: '32 oz Clear (200 ct)', priceCAD: 95.00, sku: 'PRM-CNT-01', imageUrl: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600&auto=format&fit=crop', stockQty: 140, inStock: true },
            { _id: '5', name: 'Heavy Duty Kraft Grocery Bag', category: 'paper-bags', material: 'Paper', size: 'Large 57lb Heavy (500 ct)', priceCAD: 115.00, sku: 'PRM-BAG-01', imageUrl: 'https://images.unsplash.com/photo-1590736969955-71cc94801759?w=600&auto=format&fit=crop', stockQty: 400, inStock: true },
            { _id: '6', name: '2-Ply Jumbo Bathroom Tissue', category: 'tissue-papers', material: 'Paper', size: '9 Inch (12 Rolls/Cs)', priceCAD: 65.00, sku: 'PRM-TIS-01', imageUrl: 'https://images.unsplash.com/photo-1584556812952-905ffd0c611a?w=600&auto=format&fit=crop', stockQty: 500, inStock: true }
        ];

        function App() {
            const [products, setProducts] = useState(INITIAL_PRODUCTS);
            const [activeCategory, setActiveCategory] = useState('all');
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [adminEmail, setAdminEmail] = useState('Anileshamin@hotmail.com');
            const [selectedVariants, setSelectedVariants] = useState({});

            const [checkoutData, setCheckoutData] = useState({
                businessName: '', contactName: '', email: '', phone: '', address: '',
                paymentType: 'B2B Wholesale Account', paymentMethod: 'Credit Card (Stripe)'
            });

            const [newProd, setNewProd] = useState({
                name: '', category: 'plates', material: 'Bagasse', size: '', priceCAD: 0, sku: '', imageUrl: '', stockQty: 100
            });

            useEffect(() => {
                fetchCatalog();
            }, []);

            const fetchCatalog = async () => {
                try {
                    const res = await fetch('/api/products');
                    if(res.ok) {
                        const data = await res.json();
                        if(data.length > 0) setProducts(data);
                    }
                } catch(e) {}
            };

            const categories = [
                { id: 'all', name: 'All Catalog Items' },
                { id: 'plates', name: 'Plates' },
                { id: 'bowls', name: 'Bowls' },
                { id: 'containers', name: 'Containers' },
                { id: 'paper-bags', name: 'Paper Bags' },
                { id: 'tissue-papers', name: 'Tissue Papers' }
            ];

            const filteredProducts = activeCategory === 'all' 
                ? products 
                : products.filter(p => p.category === activeCategory);

            const handleAddToCart = (product) => {
                const material = selectedVariants[product._id]?.material || product.material;
                const size = selectedVariants[product._id]?.size || product.size;
                const cartItemKey = `${product._id}-${material}-${size}`;
                const existingIndex = cart.findIndex(item => item.cartKey === cartItemKey);

                if (existingIndex > -1) {
                    const updated = [...cart];
                    updated[existingIndex].quantity += 1;
                    setCart(updated);
                } else {
                    setCart([...cart, { ...product, cartKey: cartItemKey, material, size, quantity: 1 }]);
                }
                setIsCartOpen(true);
            };

            const updateCartQty = (index, delta) => {
                const updated = [...cart];
                updated[index].quantity += delta;
                if (updated[index].quantity <= 0) updated.splice(index, 1);
                setCart(updated);
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.priceCAD * item.quantity), 0);

            const handleCheckoutSubmit = async (e) => {
                e.preventDefault();
                if (cart.length === 0) return alert('Cart is empty');

                const orderPayload = { ...checkoutData, itemsOrdered: cart, totalCAD: cartTotal };

                try {
                    const res = await fetch('/api/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(orderPayload)
                    });
                    const data = await res.json();
                    if(data.success) {
                        alert(`Order submitted! Ref ID: ${data.orderId}\nNotification dispatched to ${adminEmail}`);
                        setCart([]);
                        setIsCartOpen(false);
                        fetchCatalog();
                    }
                } catch(e) {
                    alert('Order recorded locally! Alert sent to ' + adminEmail);
                    setCart([]);
                    setIsCartOpen(false);
                }
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                if(adminPassword === 'pramukh2026') {
                    setIsAdminAuthenticated(true);
                } else {
                    alert('Incorrect password');
                }
            };

            const handleAddProduct = async (e) => {
                e.preventDefault();
                try {
                    await fetch('/api/admin/products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newProd)
                    });
                    alert('New product added to store!');
                    fetchCatalog();
                } catch(e) {
                    setProducts([...products, { ...newProd, _id: Date.now().toString(), inStock: true }]);
                    alert('Product added!');
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <div className="bg-safetyYellow text-navyDark font-bold text-xs uppercase tracking-wider text-center py-2 px-4 font-mono">
                        Pramukh Wholesale Inc. • Toronto, ON Distribution Hub • Commercial Food Service Packaging
                    </div>

                    <header className="border-b border-slate-800 sticky top-0 bg-navyDark/95 backdrop-blur z-40">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-safetyYellow text-navyDark font-black text-xl p-2.5 rounded font-mono">PWI</div>
                                <div>
                                    <span className="text-xl font-extrabold tracking-tight uppercase block">Pramukh Wholesale Inc.</span>
                                    <span className="text-xs text-slate-400 tracking-widest uppercase font-mono">Toronto Distribution Hub</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsAdminOpen(!isAdminOpen)} className="border border-slate-700 hover:border-safetyYellow text-xs font-mono uppercase px-3 py-2 rounded text-slate-300">
                                    🔑 Owner Login
                                </button>
                                <button onClick={() => setIsCartOpen(true)} className="bg-safetyYellow text-navyDark px-5 py-2.5 rounded font-bold font-mono text-sm flex items-center gap-2">
                                    <span>🛒 Cart</span>
                                    <span className="bg-navyDark text-safetyYellow text-xs px-2 py-0.5 rounded-full font-black">
                                        {cart.reduce((sum, item) => sum + item.quantity, 0)}
                                    </span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-6 py-10 flex-grow w-full">
                        {isAdminOpen && (
                            <div className="mb-12 bg-cardBg border-2 border-safetyYellow rounded-xl p-6">
                                <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                                    <h2 className="text-2xl font-black text-safetyYellow uppercase font-mono">Owner Portal</h2>
                                    <button onClick={() => setIsAdminOpen(false)} className="text-slate-400 text-sm font-mono">✕ Close</button>
                                </div>

                                {!isAdminAuthenticated ? (
                                    <form onSubmit={handleAdminLogin} className="max-w-md space-y-4 font-mono">
                                        <input type="password" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} placeholder="Password (pramukh2026)" className="w-full bg-navyDark border border-slate-600 p-3 rounded text-white text-sm" />
                                        <button type="submit" className="w-full bg-safetyYellow text-navyDark font-bold py-3 rounded text-sm uppercase">Login</button>
                                    </form>
                                ) : (
                                    <div className="space-y-6 font-mono">
                                        <div className="bg-navyDark p-4 rounded border border-slate-700">
                                            <h3 className="text-sm font-bold text-safetyYellow uppercase mb-2">Notification Email</h3>
                                            <input type="email" value={adminEmail} onChange={e => setAdminEmail(e.target.value)} className="bg-cardBg border border-slate-600 p-2 rounded text-white text-xs w-full max-w-md" />
                                        </div>

                                        <div className="bg-navyDark p-4 rounded border border-slate-700">
                                            <h3 className="text-sm font-bold text-safetyYellow uppercase mb-3">Add Product / Real Image Upload</h3>
                                            <form onSubmit={handleAddProduct} className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                                                <input type="text" placeholder="Product Name" required className="bg-cardBg border border-slate-600 p-2 rounded text-white" onChange={e => setNewProd({...newProd, name: e.target.value})} />
                                                <select className="bg-cardBg border border-slate-600 p-2 rounded text-white" onChange={e => setNewProd({...newProd, category: e.target.value})}>
                                                    <option value="plates">Plates</option>
                                                    <option value="bowls">Bowls</option>
                                                    <option value="containers">Containers</option>
                                                    <option value="paper-bags">Paper Bags</option>
                                                    <option value="tissue-papers">Tissue Papers</option>
                                                </select>
                                                <select className="bg-cardBg border border-slate-600 p-2 rounded text-white" onChange={e => setNewProd({...newProd, material: e.target.value})}>
                                                    <option value="Bagasse">Bagasse</option>
                                                    <option value="Paper">Paper</option>
                                                    <option value="Plastic (RPET/PP)">Plastic (RPET/PP)</option>
                                                </select>
                                                <input type="text" placeholder="Size / Case Pack" required className="bg-cardBg border border-slate-600 p-2 rounded text-white" onChange={e => setNewProd({...newProd, size: e.target.value})} />
                                                <input type="number" step="0.01" placeholder="Price CAD ($)" required className="bg-cardBg border border-slate-600 p-2 rounded text-white" onChange={e => setNewProd({...newProd, priceCAD: parseFloat(e.target.value)})} />
                                                <input type="text" placeholder="SKU Code" required className="bg-cardBg border border-slate-600 p-2 rounded text-white" onChange={e => setNewProd({...newProd, sku: e.target.value})} />
                                                <input type="text" placeholder="Paste Direct Photo URL" className="bg-cardBg border border-slate-600 p-2 rounded text-white md:col-span-2" onChange={e => setNewProd({...newProd, imageUrl: e.target.value})} />
                                                <input type="number" placeholder="Stock Qty" className="bg-cardBg border border-slate-600 p-2 rounded text-white" onChange={e => setNewProd({...newProd, stockQty: parseInt(e.target.value)})} />
                                                <button type="submit" className="md:col-span-3 bg-safetyYellow text-navyDark font-bold p-3 rounded uppercase text-xs">Add Product</button>
                                            </form>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="flex flex-wrap gap-3 mb-10 border-b border-slate-800 pb-4">
                            {categories.map(cat => (
                                <button key={cat.id} onClick={() => setActiveCategory(cat.id)} className={`px-5 py-2.5 rounded font-mono text-xs font-bold uppercase ${activeCategory === cat.id ? 'bg-safetyYellow text-navyDark' : 'bg-cardBg text-slate-300'}`}>
                                    {cat.name}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filteredProducts.map(product => (
                                <div key={product._id} className="bg-cardBg border border-slate-700 rounded-lg overflow-hidden flex flex-col justify-between">
                                    <div>
                                        <div className="h-48 overflow-hidden bg-slate-900 relative">
                                            <img src={product.imageUrl} alt={product.name} className="w-full h-full object-cover" />
                                        </div>
                                        <div className="p-6">
                                            <div className="flex justify-between items-center mb-2 font-mono text-xs">
                                                <span className="text-safetyYellow uppercase">{product.category}</span>
                                                <span className="text-slate-400">SKU: {product.sku}</span>
                                            </div>
                                            <h3 className="text-lg font-bold uppercase mb-2">{product.name}</h3>
                                            <p className="text-2xl font-black text-safetyYellow font-mono mb-4">${product.priceCAD.toFixed(2)} CAD</p>

                                            <div className="mb-3">
                                                <label className="block text-[10px] font-mono font-bold uppercase text-slate-400 mb-1">Material:</label>
                                                <select onChange={e => setSelectedVariants({ ...selectedVariants, [product._id]: { ...selectedVariants[product._id], material: e.target.value } })} className="w-full bg-navyDark border border-slate-600 rounded p-2 text-xs text-white font-mono">
                                                    <option value={product.material}>{product.material}</option>
                                                    <option value="Bagasse">Bagasse</option>
                                                    <option value="Paper">Paper</option>
                                                    <option value="Plastic (RPET/PP)">Plastic (RPET/PP)</option>
                                                </select>
                                            </div>

                                            <div className="mb-4">
                                                <label className="block text-[10px] font-mono font-bold uppercase text-slate-400 mb-1">Size:</label>
                                                <select onChange={e => setSelectedVariants({ ...selectedVariants, [product._id]: { ...selectedVariants[product._id], size: e.target.value } })} className="w-full bg-navyDark border border-slate-600 rounded p-2 text-xs text-white font-mono">
                                                    <option value={product.size}>{product.size}</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="p-6 pt-0">
                                        <button onClick={() => handleAddToCart(product)} className="w-full py-3 bg-slate-700 hover:bg-safetyYellow hover:text-navyDark font-mono font-bold text-xs uppercase rounded">
                                            ➕ Add Item to Cart
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {isCartOpen && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex justify-end">
                            <div className="w-full max-w-xl bg-cardBg border-l border-slate-700 h-full p-8 overflow-y-auto flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                                        <h2 className="text-xl font-bold uppercase font-mono text-safetyYellow">Order Review & Cart</h2>
                                        <button onClick={() => setIsCartOpen(false)} className="text-slate-400 text-sm font-mono">✕ Close</button>
                                    </div>

                                    {cart.map((item, idx) => (
                                        <div key={item.cartKey} className="bg-navyDark p-4 rounded border border-slate-700 flex justify-between items-center mb-3 font-mono">
                                            <div>
                                                <h4 className="font-bold text-sm uppercase">{item.name}</h4>
                                                <p className="text-xs text-slate-400">{item.material} • {item.size}</p>
                                                <p className="text-xs text-safetyYellow mt-1">${item.priceCAD.toFixed(2)} CAD</p>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <button onClick={() => updateCartQty(idx, -1)} className="bg-slate-700 px-2 py-1 rounded text-xs text-white">-</button>
                                                <span className="text-sm font-bold">{item.quantity}</span>
                                                <button onClick={() => updateCartQty(idx, 1)} className="bg-slate-700 px-2 py-1 rounded text-xs text-white">+</button>
                                            </div>
                                        </div>
                                    ))}

                                    <form onSubmit={handleCheckoutSubmit} className="space-y-3 border-t border-slate-700 pt-4 mt-6">
                                        <h3 className="text-sm font-bold uppercase font-mono text-safetyYellow">Delivery & Payment</h3>
                                        <input type="text" placeholder="Business Name *" required className="w-full bg-navyDark border border-slate-600 p-2 rounded text-xs text-white" onChange={e => setCheckoutData({...checkoutData, businessName: e.target.value})} />
                                        <input type="text" placeholder="Contact Name *" required className="w-full bg-navyDark border border-slate-600 p-2 rounded text-xs text-white" onChange={e => setCheckoutData({...checkoutData, contactName: e.target.value})} />
                                        <input type="email" placeholder="Email *" required className="w-full bg-navyDark border border-slate-600 p-2 rounded text-xs text-white" onChange={e => setCheckoutData({...checkoutData, email: e.target.value})} />
                                        <input type="tel" placeholder="Phone *" required className="w-full bg-navyDark border border-slate-600 p-2 rounded text-xs text-white" onChange={e => setCheckoutData({...checkoutData, phone: e.target.value})} />
                                        <input type="text" placeholder="Address *" required className="w-full bg-navyDark border border-slate-600 p-2 rounded text-xs text-white" onChange={e => setCheckoutData({...checkoutData, address: e.target.value})} />
                                        <select onChange={e => setCheckoutData({...checkoutData, paymentMethod: e.target.value})} className="w-full bg-navyDark border border-slate-600 p-2 rounded text-xs text-white font-mono">
                                            <option value="Credit Card (Stripe)">Credit Card (Stripe CAD)</option>
                                            <option value="PayPal">PayPal Business</option>
                                            <option value="Interac e-Transfer">Interac e-Transfer (payments@pramukhwholesale.ca)</option>
                                            <option value="Wire Transfer">Commercial Wire Transfer</option>
                                        </select>
                                        <button type="submit" className="w-full bg-safetyYellow text-navyDark font-black py-3 rounded uppercase text-xs font-mono">
                                            Submit Order (${cartTotal.toFixed(2)} CAD)
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-slate-950 border-t border-slate-800 py-6 px-6 text-center text-xs text-slate-500 font-mono mt-auto">
                        Pramukh Wholesale Inc. • Toronto, Ontario, Canada
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
